name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[test]
        # Since we listed pytest in pyproject.toml as dev dependency or we need to install it manually if not in extras
        # We did not define 'test' extra in pyproject.toml yet, but we put dependencies in [project.dependencies]
        # We need to ensure pytest is installed.
        pip install pytest

    - name: Test with pytest
      run: |
        pytest
